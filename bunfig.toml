[test]
# Tests unitarios en apps/, e2e en e2e/ (se ejecutan con playwright, no con bun test)
preload = ["./apps/api/src/test-setup.ts"]

# The elpx/ bridge runtime (exe_embed_relay.js, exe_media_host.js, exe_media_policy.js,
# embed-shim.js) is vendored byte-for-byte from mod_exelearning — the canonical source where
# its unit tests and coverage live. Here it is verified by the sync check (tools/check-embed-sync)
# and by the adversarial reconstructProvider/e2e suites, not by line coverage of the vendored
# copy. Excluding it keeps the coverage gate measuring this repo's own source.
coveragePathIgnorePatterns = [
    "**/public/elpx/**",
    "**/static/elpx/**",
]
