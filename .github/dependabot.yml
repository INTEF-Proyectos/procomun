# Dependabot: ecosistema Bun para version updates; npm solo para security updates.
# Justificación y fuentes: ADR-0040 y docs/casos/dependabot-bun-y-workspaces/.
# Docs GitHub (agosto 2026): package-ecosystem "bun" es GA (>=v1.1.39) y
# actualiza bun.lock. El ecosistema "bun" NO soporta security updates;
# "npm" sí. open-pull-requests-limit: 0 desactiva version updates de npm
# para no duplicar PRs ni volver a desincronizar bun.lock.
# https://docs.github.com/en/code-security/reference/supply-chain-security/supported-ecosystems-and-repositories
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    # Cada PR de Dependabot lanza CI + E2E (unos 9 minutos). Agrupar los
    # minor y patch en una sola PR semanal evita pagar eso por cada paquete.
    # Los major siguen yendo sueltos para poder revisarlos uno a uno.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      playwright:
        patterns:
          - "@playwright/test"
          - "playwright-core"
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
