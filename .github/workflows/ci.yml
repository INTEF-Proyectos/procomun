name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: make deps

    - name: Biome Check
      run: make lint

    # Regla 16 de AGENTS.md: todo .ts productivo nuevo va con su test. Existía
    # como script pero solo corría en local, vía `bun run test`; CI llama a
    # check-coverage y se la saltaba.
    - name: Test Files Check
      run: make check-test-files

    # ADR-0022: DESIGN.md es un contrato. Mismo caso: el script existía y CI no
    # lo ejecutaba.
    - name: Design Check
      run: make design-lint

    # ADR-0019: las claves map-keyed de status.yaml y decision-log.yaml deben
    # ser únicas. Una clave duplicada no la detecta ni git ni el parser: se
    # pierde una entrada de historial en silencio.
    - name: Tracking Check
      run: make check-tracking

    - name: Type Check
      run: bunx tsc --noEmit
      continue-on-error: true

    - name: Run Tests & Coverage
      run: make check-coverage

  # De momento solo se publica en push a main con tags main y latest.
  # Cuando haya releases se añadirán tags semánticos (vX.Y.Z).
  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Normalize image name to lowercase
      run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: |
          ${{ env.IMAGE_NAME }}:main
          ${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
