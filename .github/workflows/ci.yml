name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

# Un push nuevo cancela el run anterior de la misma rama. En main NO se cancela:
# cada commit de main publica imagen y no queremos abortar una publicación a
# medias ni dejar el registro en un estado indeterminado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Por defecto solo lectura: el job `build` ejecuta código de la PR y no necesita
# más. `packages: write` se concede solo al job que publica.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        # Fijado a propósito: con `latest`, una release de bun cambia CI sin que
        # nadie toque el repo y los runs dejan de ser reproducibles.
        bun-version: 1.3.14

    - name: Install dependencies
      run: make deps

    - name: Verify the vendored external-media artifact
      # eXeLearning core is canonical (eXe ADR-0021): this repo holds the BYTES and
      # verifies them against the manifest core published, rather than a copy of the
      # logic that could drift. --build-hash makes it a PROVENANCE check and not merely
      # an integrity one: without it a locally rebuilt-and-resigned copy would pass.
      #
      # If this fails, a vendored file was edited here. Fix it in eXeLearning core and
      # re-vendor; a local patch is invisible upstream and is overwritten next time.
      run: |
        # The expected hash is PINNED HERE, deliberately, and not read from the vendored
        # manifest. A hash taken from the copy under test cannot say anything about that
        # copy: file, digest and buildHash can all be rewritten together, and a check that
        # trusted them would pass a consistent forgery. This line is the out-of-band half.
        # Bump it in the same commit that re-vendors the artifact.
        # Dos copias vendorizadas, una por app: el frontend la sirve por URL pública y el
        # API lee sus bytes en runtime para inyectar el lado hijo en cada HTML del .elpx.
        # Ambas se verifican contra el MISMO buildHash, así que no pueden derivar entre sí.
        node apps/frontend/public/elpx/exe_external_media/verify.mjs apps/frontend/public/elpx/exe_external_media --build-hash "43c776daa551fd770b6dade520629362e5a8ca8745e4245c359447c4689b34d6"
        node apps/api/static/elpx/exe_external_media/verify.mjs apps/api/static/elpx/exe_external_media --build-hash "43c776daa551fd770b6dade520629362e5a8ca8745e4245c359447c4689b34d6"

    - name: Biome Check
      run: make lint

    # Regla 16 de AGENTS.md: todo .ts productivo nuevo va con su test. Existía
    # como script pero solo corría en local, vía `bun run test`; CI llama a
    # check-coverage y se la saltaba.
    - name: Test Files Check
      run: make check-test-files

    # ADR-0022: DESIGN.md es un contrato. Mismo caso: el script existía y CI no
    # lo ejecutaba.
    - name: Design Check
      run: make design-lint

    # ADR-0019: las claves map-keyed de status.yaml y decision-log.yaml deben
    # ser únicas. Una clave duplicada no la detecta ni git ni el parser: se
    # pierde una entrada de historial en silencio.
    - name: Tracking Check
      run: make check-tracking

    # Antes esto era `bunx tsc --noEmit` con `continue-on-error: true`: GitHub
    # reescribía la conclusión a success y el paso salía en verde emitiendo 617
    # errores. Ahora se compara contra una línea base: la deuda existente se
    # tolera, pero no puede crecer (ver scripts/check-types.ts).
    - name: Type Check
      run: make check-types

    - name: Run Tests & Coverage
      run: make check-coverage

  # De momento solo se publica en push a main con tags main y latest.
  # Cuando haya releases se añadirán tags semánticos (vX.Y.Z).
  # E2E sobre el resultado ya fusionado. Antes solo corrían en pull_request, así
  # que la imagen de main se publicaba sin que nadie hubiera probado el merge:
  # dos PRs verdes por separado pueden romper main al juntarse.
  e2e:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    uses: ./.github/workflows/e2e.yml

  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, e2e]
    runs-on: ubuntu-latest

    # Solo este job publica en el registro.
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Normalize image name to lowercase
      run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: |
          ${{ env.IMAGE_NAME }}:main
          ${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
