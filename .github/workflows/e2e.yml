name: E2E Tests

on:
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:
  # Invocable desde ci.yml para exigir E2E sobre el merge antes de publicar
  # imagen. Antes solo corrían en pull_request, nunca sobre el resultado ya
  # fusionado.
  workflow_call:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  e2e-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.4

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Install Playwright browsers (Chromium)
      run: bunx playwright install --with-deps chromium

    - name: Seed database
      run: bun run --filter '@procomun/cli' cli -- seed

    - name: Start application
      run: |
        # La salida del servidor va a un fichero: lanzado en segundo plano, lo
        # que escribe después de este paso no sale en el log del job, y sin él
        # no se veía que la API había muerto a mitad de la suite (#489).
        mkdir -p e2e-server
        bun run dev > e2e-server/dev.log 2>&1 &
        # Espera a que frontend y API respondan. Antes se usaba `npx wait-on`,
        # que se descargaba de la red en cada run, sin versión fijada y sin estar
        # declarado como dependencia en ninguna parte.
        for i in $(seq 1 60); do
          if curl -sf http://localhost:5173 > /dev/null \
            && curl -sf http://localhost:3000/health > /dev/null; then
            echo "Servicios listos tras ${i}s"
            exit 0
          fi
          sleep 1
        done
        echo "Timeout: los servicios no respondieron en 60s"
        cat e2e-server/dev.log
        exit 1
      env:
        NODE_ENV: test

    - name: Run E2E tests (Chromium)
      run: bun run test:e2e
      env:
        E2E_BASE_URL: http://localhost:5173
        CI: true

    - name: Server state after E2E
      if: failure()
      run: |
        ps -eo pid,ppid,rss,etime,args | grep -E 'index.ts|vite' | grep -v grep || true
        free -m
        sudo dmesg | grep -i -E 'out of memory|killed process' || true
        tail -n 200 e2e-server/dev.log

    - name: Capture desktop visual previews
      if: github.event_name == 'pull_request'
      run: bunx playwright test e2e/visual-preview.e2e.ts --project=chromium --workers=1
      env:
        CAPTURE_VISUAL_PREVIEWS: "true"
        E2E_BASE_URL: http://localhost:5173
        VISUAL_PREVIEW_DIR: visual-previews
        CI: "true"

    - name: Upload visual previews
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: visual-previews-pr-${{ github.event.pull_request.number }}-attempt-${{ github.run_attempt }}
        path: visual-previews/
        if-no-files-found: error
        retention-days: 1

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report-chromium
        path: |
          playwright-report/
          test-results/
          e2e-server/
        retention-days: 7

  # Firefox y WebKit solo se lanzan a mano (workflow_dispatch) para no gastar CI
  # en cada PR. No hay trigger `schedule`: el comentario anterior lo daba por
  # hecho y no era cierto.
  e2e-cross-browser:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        browser: [firefox, webkit]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.4

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Install Playwright browsers
      run: bunx playwright install --with-deps ${{ matrix.browser }}

    - name: Seed database
      run: bun run --filter '@procomun/cli' cli -- seed

    - name: Start application
      run: |
        bun run dev &
        for i in $(seq 1 60); do
          if curl -sf http://localhost:5173 > /dev/null \
            && curl -sf http://localhost:3000/health > /dev/null; then
            echo "Servicios listos tras ${i}s"
            exit 0
          fi
          sleep 1
        done
        echo "Timeout: los servicios no respondieron en 60s"
        exit 1
      env:
        NODE_ENV: test

    - name: Run E2E tests (${{ matrix.browser }})
      run: bunx playwright test --project=${{ matrix.browser }}
      env:
        E2E_BASE_URL: http://localhost:5173
        CI: true

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report-${{ matrix.browser }}
        path: |
          playwright-report/
          test-results/
        retention-days: 7
