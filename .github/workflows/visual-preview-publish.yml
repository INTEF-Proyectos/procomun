name: Publish Visual Previews

on:
  workflow_run:
    workflows: ["E2E Tests"]
    types: [completed]

# This trusted workflow never checks out or executes pull-request code. It only
# validates bounded PNG artifacts from a successful E2E run before publishing.
#
# pull-requests: write is required to list/create/update PR comments via the
# issues comments API. With only issues: write, GitHub returns 403
# "Resource not accessible by integration" and x-accepted-github-permissions
# shows issues=read; pull_requests=read.
permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: visual-preview-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Download visual previews
      uses: actions/download-artifact@v7
      with:
        name: visual-previews-pr-${{ github.event.workflow_run.pull_requests[0].number }}-attempt-${{ github.event.workflow_run.run_attempt }}
        path: visual-previews
        repository: ${{ github.repository }}
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}

    - name: Validate and stage PNG assets
      env:
        PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        ASSET_DIR: ${{ runner.temp }}/visual-preview-assets
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$ASSET_DIR"

        mapfile -d '' files < <(
          find visual-previews -maxdepth 1 -type f -name '*.png' -print0 | sort -z
        )

        if (( ${#files[@]} == 0 || ${#files[@]} > 20 )); then
          echo "Expected between 1 and 20 PNG files, found ${#files[@]}." >&2
          exit 1
        fi

        for source in "${files[@]}"; do
          filename="$(basename -- "$source")"
          if [[ ! "$filename" =~ ^[a-z0-9][a-z0-9-]{0,63}\.png$ ]]; then
            echo "Rejected unsafe filename: $filename" >&2
            exit 1
          fi

          size="$(stat -c %s -- "$source")"
          if (( size == 0 || size > 10485760 )); then
            echo "Rejected PNG size for $filename: $size bytes" >&2
            exit 1
          fi

          signature="$(head -c 8 -- "$source" | od -An -tx1 | tr -d ' \n')"
          if [[ "$signature" != "89504e470d0a1a0a" ]]; then
            echo "Rejected invalid PNG signature: $filename" >&2
            exit 1
          fi

          cp -- "$source" "$ASSET_DIR/pr-${PR_NUMBER}-${HEAD_SHA:0:12}-${filename}"
        done

    - name: Publish latest assets
      env:
        GH_TOKEN: ${{ github.token }}
        # Sin checkout: gh no puede inferir el repo desde .git. GH_REPO evita
        # "fatal: not a git repository" en release view/create/upload.
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        ASSET_DIR: ${{ runner.temp }}/visual-preview-assets
        PREVIEW_TAG: pr-visual-previews
      shell: bash
      run: |
        set -euo pipefail

        # Crear la prerelease solo por API REST (target_commitish=main).
        # `gh release create --target main` resuelve la rama con git local y
        # falla en este job, que a propósito no hace checkout.
        if ! gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PREVIEW_TAG}" >/dev/null 2>&1; then
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$PREVIEW_TAG" \
            -f target_commitish=main \
            -f name="Pull request visual previews" \
            -f body="Latest automated desktop screenshots for open pull requests." \
            -F prerelease=true
        fi

        release_id="$(
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PREVIEW_TAG}" --jq '.id'
        )"

        while read -r asset_id; do
          [[ -z "$asset_id" ]] && continue
          gh api \
            --method DELETE \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
        done < <(
          gh api \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" \
            --paginate \
            --jq ".[] | select(.name | startswith(\"pr-${PR_NUMBER}-\")) | .id"
        )

        for asset in "$ASSET_DIR"/*.png; do
          # GH_REPO evita el fallo de git local; --clobber por si reintenta el mismo SHA
          gh release upload "$PREVIEW_TAG" "$asset" --clobber
        done

    - name: Create or update pull-request comment
      uses: actions/github-script@v9
      env:
        ASSET_DIR: ${{ runner.temp }}/visual-preview-assets
        PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        COMPLETED_AT: ${{ github.event.workflow_run.updated_at }}
        RUN_URL: ${{ github.event.workflow_run.html_url }}
        PREVIEW_TAG: pr-visual-previews
      with:
        script: |
          const fs = require("fs");
          const path = require("path");

          const marker = "<!-- procomun-visual-previews -->";
          const prefix = `pr-${process.env.PR_NUMBER}-${process.env.HEAD_SHA.slice(0, 12)}-`;
          const assets = fs.readdirSync(process.env.ASSET_DIR)
            .filter((name) => name.startsWith(prefix) && name.endsWith(".png"))
            .sort();

          if (assets.length === 0) {
            core.setFailed("No validated visual-preview assets were found.");
            return;
          }

          const assetBase = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${process.env.PREVIEW_TAG}`;
          const sections = assets.map((asset) => {
            const id = asset.slice(prefix.length, -4);
            const title = id
              .split("-")
              .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
              .join(" ");
            const imageUrl = `${assetBase}/${encodeURIComponent(asset)}`;
            return `### ${title}\n\n![${title}](${imageUrl})`;
          });

          const body = [
            marker,
            "## Visual previews",
            "",
            `Commit: \`${process.env.HEAD_SHA.slice(0, 12)}\``,
            `E2E run completed: ${new Date(process.env.COMPLETED_AT).toISOString()}`,
            `[Open workflow run](${process.env.RUN_URL})`,
            "",
            ...sections,
          ].join("\n");

          const comments = await github.paginate(
            github.rest.issues.listComments,
            {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              per_page: 100,
            },
          );
          const existing = comments.find((comment) => comment.body?.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body,
            });
          }
