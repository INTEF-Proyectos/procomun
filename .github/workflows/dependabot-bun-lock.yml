name: Sync bun.lock on Dependabot PRs

# El ecosistema nativo `bun` (ADR-0040) ya regenera bun.lock en version
# updates. Este workflow sigue haciendo falta para los security updates
# del ecosistema `npm` (open-pull-requests-limit: 0): GitHub aún no
# publica security updates para `bun`, y npm solo toca package.json.
#
# OJO con `pull_request_target`: corre con los secretos del repo base y con
# contents: write, y este workflow hace checkout del head de la PR y ejecuta
# `bun install` sobre él. La guarda `github.actor == 'dependabot[bot]'` de abajo
# es la mitigación que documenta GitHub para este patrón, y bun no ejecuta
# scripts de ciclo de vida por defecto (trustedDependencies). No añadir aquí
# pasos que ejecuten código de la PR (build, tests) sin repensar esto.
on:
  pull_request_target:
    branches: [ "main", "develop" ]
    paths:
      - "**/package.json"

permissions:
  contents: write
  pull-requests: read

jobs:
  sync-lockfile:
    if: github.actor == 'dependabot[bot]'
    # Dónde corre lo decide la variable USE_SELFHOSTED_RUNNER del repositorio:
    # `true` usa el runner propio (gordobot); `false` o sin definir, los de
    # GitHub. Se cambia con `gh variable set USE_SELFHOSTED_RUNNER --body false`
    # sin tocar ningún workflow.
    runs-on: ${{ vars.USE_SELFHOSTED_RUNNER == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Regenerate bun.lock
        run: bun install

      - name: Commit and push if changed
        run: |
          if git diff --quiet bun.lock; then
            echo "bun.lock already in sync"
            exit 0
          fi
          git config user.name "dependabot[bot]"
          git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: sync bun.lock"
          git push
