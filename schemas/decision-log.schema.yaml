$schema: "https://json-schema.org/draft/2020-12/schema"
title: Decision Log
description: >
  Índice de decisiones arquitectónicas (ADRs) del proyecto Procomún.
  Cada entrada usa una clave ADR-NNNN como identificador único.
type: object
patternProperties:
  "^ADR-\\d{4}[a-z]?$":
    type: object
    required: [title, status, date, file]
    properties:
      title:
        type: string
        description: Título descriptivo de la decisión
      status:
        type: string
        enum: [Propuesto, Aceptado, Rechazado, Supersedido, Obsoleto]
        description: Estado actual de la decisión
      date:
        type: string
        format: date
        description: Fecha de la decisión (YYYY-MM-DD)
      file:
        type: string
        pattern: "^\\d{4}-.+\\.md$"
        description: Nombre del archivo .md con el detalle
      superseded_by:
        type: string
        pattern: "^ADR-\\d{4}$"
        description: ADR que supersede esta decisión
    additionalProperties: false
additionalProperties: false
