# JSON Schema (YAML notation) for status.yaml
# Validates the map-keyed project state file (ADR-0019).
$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://procomun.intef.es/schemas/status.schema.yaml"
title: "Procomún Project Status"
description: >
  Schema for the global project state board (status.yaml).
  Uses map-keyed task entries (T-YYYY-MM-DD-NNN format) to allow parallel agent
  work without merge conflicts. A single `tasks` map replaces the old
  active_tasks/completed_tasks split; each task carries its own status field.
type: object
required:
  - metadata
  - blocking_adrs
  - tasks

properties:
  metadata:
    type: object
    required:
      - phase
      - epic
      - current_agent
    properties:
      phase:
        type: string
        description: "Current project phase name (e.g. 'Fase 1 — MVP de catálogo')"
      epic:
        type: string
        description: "Description of the currently active epic(s)"
      current_agent:
        type: string
        description: "Agent(s) currently holding the turn (e.g. '@.agents/skills/...')"
      instructions:
        type: string
        description: "Operational instructions for agents reading this file"
    additionalProperties: false

  blocking_adrs:
    type: object
    description: "Map of ADR identifiers to their blocking status"
    additionalProperties:
      $ref: "#/definitions/adr_entry"

  tasks:
    type: object
    description: "Map of task keys (T-YYYY-MM-DD-NNN) to task entries. Status field distinguishes active from completed."
    additionalProperties:
      $ref: "#/definitions/task_entry"

definitions:
  adr_entry:
    type: object
    required:
      - title
      - status
    properties:
      title:
        type: string
        description: "Short title of the ADR"
      file:
        type: string
        description: "Path to the ADR markdown file (relative to repo root)"
      status:
        type: string
        enum: [Pending, In Progress, Done]
        description: "Resolution status of the ADR"
      notes:
        type: string
        description: "Optional notes about the ADR"
    additionalProperties: false

  task_entry:
    type: object
    required:
      - date
      - task
      - status
    properties:
      date:
        type: string
        format: date
        description: "ISO 8601 date when the task was completed or started (YYYY-MM-DD)"
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      agent:
        type: string
        description: "Agent(s) responsible for this task (skill name or shorthand)"
      role:
        type: string
        description: "Role of the agent (alternative to agent field)"
      task:
        type: string
        description: "Description of the task, deliverable or action taken"
      status:
        type: string
        enum: [Pending, In Progress, Done]
        description: "Current status of the task"
      related:
        type: array
        description: "List of related ADR identifiers"
        items:
          type: string
        default: []
      notes:
        type: string
        description: "Extended notes, validation results, risks, handoff recommendations"
    additionalProperties: false
