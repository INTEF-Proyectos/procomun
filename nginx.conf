# Logs sin URL de capacidad. En estas URL el permiso va en la propia URL y
# quien lea el log podria abrirlas:
# - enlace firmado de un recurso no publicado (#466):
#   /api/v1/elpx/preview/<hash>/<token>/... Se tapa el token y se deja el hash,
#   que dice que recurso se vio;
# - miniatura firmada de un recurso no publicado (#512):
#   /api/v1/thumbnails/signed/<token>/<fichero>. Se tapa el token;
# - enlace del correo de recuperacion de contrasena (#551):
#   /api/auth/reset-password/<token>?callbackURL=... Se tapa el token;
# - instantanea de la vista previa del editor (#317):
#   /api/v1/preview/<id>/... y /api/v1/preview-session/<id>.
# Los marcadores son los de redactAuditPath (#317, #536).
#
# LA QUERY NO SE REGISTRA NUNCA (revision de #524). Taparla por nombre de
# parametro era una carrera perdida: `?token=A&token=B` dejaba el primero,
# `?t%6fken=A` no casaba con `token=` aunque Better Auth lo decodifique igual,
# y al casar primero una ruta sensible el map devolvia su resultado sin tocar
# la query. En lugar de perseguir variantes se registra solo la ruta ($uri, que
# nginx da ya normalizada y sin query) y un marcador `?:query` cuando habia
# query. Contrapartida: el access_log pierde los parametros de busqueda y
# paginacion. Esta en docs/operaciones/operaciones.md.
#
# El error_log no admite formato y puede escribir la peticion entera.
# Primero se quita la query de la peticion, dejando constancia de que la habia.
# Se parte de $request_uri y no de $uri porque $uri es la ruta DESPUES del
# try_files del SPA: con el, cualquier ruta del frontend se registraba como
# /index.html y el log perdia que se habia pedido.
#
# Ruta no canonica (segunda revision de #524): `..`, `.`, `//`, `\` o su forma
# %xx. nginx y la API la resuelven, asi que la ruta pedida no es la servida y
# las regex de redaccion no la reconocen: /x/../api/v1/elpx/preview/<hash>/<token>/
# llega al handler con el token valido. La de la API se registra ya normalizada
# (map de $uri, abajo); aqui, fuera de la API, no se intenta normalizar: se
# escribe `/:noncanonical` en lugar de la ruta.
map $request_uri $request_path_raw {
    "~*^[^?]*(?:/\.\.?(?=[/?]|$)|//|\x5c|%2e|%2f|%5c)[^?]*[?]"  "/:noncanonical?:query";
    "~*^[^?]*(?:/\.\.?(?=[/?]|$)|//|\x5c|%2e|%2f|%5c)"  "/:noncanonical";
    "~^(?<req_base>[^?]*)[?]"  "${req_base}?:query";
    # Peticion mal formada: "-" en vez de la linea en crudo, que no se redacta.
    "" "-";
    default $request_uri;
}

map $is_args $query_marker {
    "?" "?:query";
    default "";
}

# $request_uri llega en crudo, pero la API enruta sobre la ruta decodificada:
# /api/v1/elpx/previe%77/<hash>/<token>/ (o /%61pi/...) llega al handler con
# el token valido y la regex de abajo no la reconocia. En la API se registra
# $uri, la ruta que nginx ya ha decodificado y normalizado (%xx, //), la misma
# con la que elige la location, asi que lo que llega a la API se redacta como
# lo ve la API. En /api/ no hay try_files que cambie $uri. Fuera de la API se
# sigue usando la ruta pedida. nginx escapa como \xNN las comillas y los
# caracteres de control que el %xx pueda traer, asi que no se cuelan lineas.
#
# $uri ya viene sin `..`, `.` ni `//`, pero nginx no trata `\` como separador y
# Bun si: /api/v1\elpx\preview\<hash>\<token>\ llega al handler. Con una barra
# invertida (o %5c, que nginx decodifica) se escribe `/:noncanonical`.
map $uri $request_path {
    "~^/api/.*\x5c"  "/:noncanonical${query_marker}";
    "~^/api/"  "${uri}${query_marker}";
    default $request_path_raw;
}

map $request_path $redacted_path {
    "~*^(?<uri_pre>/api/v1/elpx/preview/[^/?]+/)[^/?]+(?<uri_post>.*)$"  "${uri_pre}:token${uri_post}";
    "~*^(?<uri_pre>/api/v1/thumbnails/signed/)[^/?]+(?<uri_post>.*)$"  "${uri_pre}:token${uri_post}";
    "~*^(?<uri_pre>/api/auth/reset-password/)[^/?]+(?<uri_post>.*)$"  "${uri_pre}:token${uri_post}";
    "~*^(?<uri_pre>/api/v1/preview(?:-session)?/)[^/?]+(?<uri_post>.*)$"  "${uri_pre}:previewId${uri_post}";
    default $request_path;
}

# El Referer lo manda el cliente entero, asi que primero se le quita la query y
# el fragmento y despues se redacta la ruta. El HTML del .elpx sale con
# Referrer-Policy: same-origin, asi que sus CSS, JS e imagenes se piden con la
# URL firmada en el Referer.
#
# El Referer no tiene version decodificada, y el navegador lo manda tal cual se
# pidio la pagina: si se abrio /api/v1/elpx/previe%77/<hash>/<token>/, sus CSS
# e imagenes llevan ese Referer. Se falla cerrado: con un %xx en la ruta se
# registra solo el origen y `/:encoded`. Se pierde la ruta de algun Referer con
# tildes; a cambio no hay que adivinar como decodifica cada servicio.
map $http_referer $referer_path {
    "~^(?<ref_origin>(?:[a-zA-Z][a-zA-Z0-9+.-]*://[^/?#]*)?)[^?#]*%"  "${ref_origin}/:encoded";
    # Ruta no canonica (`..`, `.`, `//`, `\`): el servidor la resuelve y las
    # regex de abajo no. Queda el origen y `/:noncanonical`. La URL absoluta va
    # aparte de la relativa para que el `//` del esquema no cuente como barra
    # repetida.
    "~^(?<ref_origin>[a-zA-Z][a-zA-Z0-9+.-]*://[^/?#]*)[^?#]*?(?:/\.\.?(?=[/?#]|$)|//|\x5c)"  "${ref_origin}/:noncanonical";
    "~^(?=/)[^?#]*?(?:/\.\.?(?=[/?#]|$)|//|\x5c)"  "/:noncanonical";
    "~^(?<ref_base>[^?#]*)[?#]"  "${ref_base}?:query";
    # Sin Referer: "-", como en el formato main.
    "" "-";
    default $http_referer;
}

map $referer_path $redacted_referer {
    "~*^(?<ref_pre>(?:https?://[^/]+)?/api/v1/elpx/preview/[^/?#]+/)[^/?#]+(?<ref_post>.*)$"  "${ref_pre}:token${ref_post}";
    "~*^(?<ref_pre>(?:https?://[^/]+)?/api/v1/thumbnails/signed/)[^/?#]+(?<ref_post>.*)$"  "${ref_pre}:token${ref_post}";
    "~*^(?<ref_pre>(?:https?://[^/]+)?/api/auth/reset-password/)[^/?#]+(?<ref_post>.*)$"  "${ref_pre}:token${ref_post}";
    "~*^(?<ref_pre>(?:https?://[^/]+)?/api/v1/preview(?:-session)?/)[^/?#]+(?<ref_post>.*)$"  "${ref_pre}:previewId${ref_post}";
    default $referer_path;
}

# El formato main de nginx:alpine con la ruta redactada y sin la query, y con
# el Referer redactado, en lugar de $request y $http_referer.
log_format main_redacted '$remote_addr - $remote_user [$time_local] "$request_method $redacted_path $server_protocol" '
                         '$status $body_bytes_sent "$redacted_referer" '
                         '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log main_redacted;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the api container
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload support (large files)
        client_max_body_size 10G;
        proxy_request_buffering off;
    }

    # Contenido de los paquetes .elpx: sin X-Frame-Options (ADR-0026, adenda
    # 2026-10-14). Su HTML es origen opaco y la cabecera bloquea los iframes
    # hijos del propio paquete. Un add_header aquí corta la herencia de los del
    # server, así que se redeclara nosniff. `^~` evita que la regex de estáticos
    # de abajo se quede con sus .js, .css e imágenes.
    location ^~ /api/v1/elpx/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Miniaturas (#472, #470): la API comprueba el estado del recurso y pone el
    # Cache-Control (ADR-0046, adenda 2026-11-03). `^~` por lo mismo que arriba:
    # sin él, la regex de estáticos se queda con los .jpg y nunca llegan a la API.
    location ^~ /api/v1/thumbnails/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Astro static SPA — try files, then fallback to index.html
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
