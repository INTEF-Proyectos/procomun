# Logs sin URL de capacidad. En estas URL el permiso va en la propia URL y
# quien lea el log podría abrirlas:
# - enlace firmado de un recurso no publicado (#466):
#   /api/v1/elpx/preview/<hash>/<token>/… Se tapa el token y se deja el hash,
#   que dice qué recurso se vio;
# - instantánea de la vista previa del editor (#317):
#   /api/v1/preview/<id>/… y /api/v1/preview-session/<id>;
# - ?token= en la query (verificación de correo de Better Auth).
# El Referer también: el HTML del .elpx sale con Referrer-Policy: same-origin
# y sus CSS, JS e imágenes llevan la URL firmada. Los marcadores son los de
# redactAuditPath (#317). El error_log no admite formato y puede escribir
# la petición entera (docs/operaciones/operaciones.md).
map $request_uri $redacted_uri {
    "~*^(?<uri_pre>/api/v1/elpx/preview/[^/?]+/)[^/?]+(?<uri_post>.*)$"  "${uri_pre}:token${uri_post}";
    "~*^(?<uri_pre>/api/v1/preview(?:-session)?/)[^/?]+(?<uri_post>.*)$"  "${uri_pre}:previewId${uri_post}";
    "~*^(?<uri_pre>[^?]*[?](?:.*&)?token=)[^&]*(?<uri_post>.*)$"  "${uri_pre}:token${uri_post}";
    # Petición mal formada: "-" en vez de la línea en crudo, que no se redacta.
    "" "-";
    default $request_uri;
}

map $http_referer $redacted_referer {
    "~*^(?<ref_pre>(?:https?://[^/]+)?/api/v1/elpx/preview/[^/?]+/)[^/?]+(?<ref_post>.*)$"  "${ref_pre}:token${ref_post}";
    "~*^(?<ref_pre>(?:https?://[^/]+)?/api/v1/preview(?:-session)?/)[^/?]+(?<ref_post>.*)$"  "${ref_pre}:previewId${ref_post}";
    "~*^(?<ref_pre>[^?]*[?](?:.*&)?token=)[^&]*(?<ref_post>.*)$"  "${ref_pre}:token${ref_post}";
    # Sin Referer: "-", como en el formato main.
    "" "-";
    default $http_referer;
}

# El formato main de nginx:alpine con $redacted_uri y $redacted_referer en
# lugar de $request y $http_referer.
log_format main_redacted '$remote_addr - $remote_user [$time_local] "$request_method $redacted_uri $server_protocol" '
                         '$status $body_bytes_sent "$redacted_referer" '
                         '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log main_redacted;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the api container
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload support (large files)
        client_max_body_size 10G;
        proxy_request_buffering off;
    }

    # Contenido de los paquetes .elpx: sin X-Frame-Options (ADR-0026, adenda
    # 2026-10-14). Su HTML es origen opaco y la cabecera bloquea los iframes
    # hijos del propio paquete. Un add_header aquí corta la herencia de los del
    # server, así que se redeclara nosniff. `^~` evita que la regex de estáticos
    # de abajo se quede con sus .js, .css e imágenes.
    location ^~ /api/v1/elpx/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Astro static SPA — try files, then fallback to index.html
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
