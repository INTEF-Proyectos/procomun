server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the api container
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload support (large files)
        client_max_body_size 10G;
        proxy_request_buffering off;
    }

    # Contenido de los paquetes .elpx: sin X-Frame-Options (ADR-0026, adenda
    # 2026-10-14). Su HTML es origen opaco y la cabecera bloquea los iframes
    # hijos del propio paquete. Un add_header aquí corta la herencia de los del
    # server, así que se redeclara nosniff. `^~` evita que la regex de estáticos
    # de abajo se quede con sus .js, .css e imágenes.
    location ^~ /api/v1/elpx/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Miniaturas (#472, #470): la API comprueba el estado del recurso y pone el
    # Cache-Control (ADR-0046, adenda 2026-11-03). `^~` por lo mismo que arriba:
    # sin él, la regex de estáticos se queda con los .jpg y nunca llegan a la API.
    location ^~ /api/v1/thumbnails/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Astro static SPA — try files, then fallback to index.html
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
