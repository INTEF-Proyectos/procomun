ADR-0037:
  title: "Modelo de perfil y migración de usuarios legacy"
  status: Propuesto
  date: 2026-08-06
  file: 0037-modelo-migracion-perfil-usuarios-legacy.md
  notes: >
    Define un perfil de dominio separado de Better Auth y clasifica los campos del
    exportador legacy por finalidad. La propuesta conserva identidad y contexto
    educativo de utilidad potencial con visibilidad privada por defecto, y excluye
    contraseñas, DNI, fecha de nacimiento y sexo. No autoriza implementar ni cargar
    perfiles hasta revisión de Producto, Arquitectura, Metadatos y Privacidad.

ADR-0039:
  title: "Versionado mínimo de recursos: historial ELPX automático y proyección vigente"
  status: Aceptado
  date: 2026-08-11
  file: 0039-versionado-recursos-mvp.md
  notes: >
    Issue #31. Cada nuevo .elpx crea automáticamente la siguiente versión y actualiza
    current_version_id. No hay publicación manual de versiones ni notas de versión;
    se conservan historial, descarga y restauración no destructiva.

ADR-0040:
  title: "Dependabot con ecosistema Bun y workspaces del monorepo"
  status: Aceptado
  date: 2026-08-18
  file: 0040-dependabot-bun-y-workspaces-monorepo.md
  notes: >
    Version updates con package-ecosystem bun (GA, actualiza bun.lock). npm se
    conserva solo para security updates (open-pull-requests-limit: 0) porque
    GitHub aún no las ofrece para Bun. Los cinco package.json del monorepo no
    se unifican: son workspaces con grafos distintos.

ADR-0041:
  title: "Controles de seguridad en recursos, ELPX y uploads"
  status: Aceptado
  date: 2026-09-06
  file: 0041-controles-seguridad-recursos-uploads.md
  notes: >
    Auditoría realizada con Codex GPT-6 y el skill security-audit. Unifica RBAC,
    protege borradores, adelanta límites anti ZIP bomb y añade controles contra
    abuso de descargas y almacenamiento.

ADR-0042:
  title: "Catálogo controlado de palabras clave"
  status: Aceptado
  date: 2026-10-14
  file: 0042-catalogo-controlado-palabras-clave.md
  notes: >
    Issue #384. Extiende tags (ADR-0034) con catalog, created_by y tag_aliases.
    Máximo 5 por recurso y alta solo para admin y curator con confirmación.
    Actualizada el 2026-10-14: sembrado en la migración 0010, la vía antigua no
    toca el catálogo y lo elegido llega a FTS, feeds, API v1 y recomendaciones.
    La correspondencia de etiquetas antiguas va en un PR aparte.

ADR-0043:
  title: "Catálogo de categorización educativa en código"
  status: Propuesto
  date: 2026-10-14
  file: 0043-catalogo-categorizacion-educativa.md
  notes: >
    Issue #380. Catálogo cerrado con ids estables en packages/db/src/educational-areas.ts
