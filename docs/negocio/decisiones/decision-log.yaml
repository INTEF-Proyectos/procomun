    resource_levels queda como dato de origen. La correspondencia con LOM-ES se hará
    en el exportador a partir de los ids.

ADR-0045:
  title: "Áreas de conocimiento en tabla gestionada y familias profesionales en código"
  status: Propuesto
  date: 2026-10-26
  file: 0045-areas-de-conocimiento-y-familias-profesionales.md
  notes: >
    Issue #448, primer PR. Tabla knowledge_areas (56 áreas iniciales, 9 bloques fijos
    en código, sin borrado, desactivables), resource_knowledge_areas (máximo 3) y
    resource_professional_families (lista oficial en código, solo FP). tags.retired_at
    retira de las palabras clave los términos que pasan a ser áreas, con informe en
    seco (catalog:area-keywords).
ADR-0044:
  title: "Contador de visitas por recurso sin datos personales"
  status: Propuesto
  date: 2026-10-26
  file: 0044-contador-visitas-recurso.md
  notes: >
    Issue #421. Una visita por sesión al abrir la vista previa, solo en recursos
    publicados. UUID aleatorio por pestaña en sessionStorage; el servidor guarda
    su SHA-256 24 h en resource_view_sessions. Totales en resource_view_counts
    (view_count + legacy_view_count importado). Migración 0013_resource_views.

ADR-0046:
  title: "Miniaturas generadas en el servidor para los paquetes sin imagen"
  status: Aceptado
  date: 2026-10-27
  file: 0046-miniaturas-generadas-en-servidor.md
  notes: >
    Issue #470. Propuesta: servicio interno thumbnailer con Playwright y
    Chromium en un contenedor aparte, sin red ni secretos, que sirve el paquete
    desde disco con page.route() y la CSP de origen opaco; cola con el estado en
    elpx_projects y un bucle en la API. Gotenberg queda como alternativa detrás
    de la misma interfaz. Aceptada el 2026-11-03: JPEG 640x400 solo del
    contenido, relleno solo de lo que no tiene imagen propia, el iframe sale de
    los listados al desplegar y Node si Playwright no va bien con Bun.
    Adenda 2026-11-03 (revisión de #481): la miniatura de lo publicado sale
    por la URL estable solo si pertenece a un recurso publicado (public,
    max-age=3600); lo no publicado, por enlace firmado (private, no-store).

ADR-0049:
  title: "Flujo de revisión editorial, comentarios privados y sello «Validado»"
  status: Propuesto
  date: 2026-11-03
  file: 0049-flujo-revision-editorial-y-sello-validado.md
  notes: >
    Issues #496 y #420. Propuesta: estados changes_requested y rejected
    (pendiente y en revisión se distinguen por el curator asignado), acciones
    por rol con motivo obligatorio, hilo privado resource_review_comments,
    historial append-only resource_editorial_events en la misma transacción y
    notificaciones propias con correo por EmailPort (ADR-0031). Sello en
    columnas validated_at, validated_by y validation_source, no deducido de
    assignedCuratorId. Importados con certified 1 y publicados llevan sello.
    Con #506, #507 y #515 casi todos son editor y publican sin revisión, así
    que el sello se gana sobre todo validando lo publicado: cola de publicados
    sin validar y solicitud de validación del editor, sin pasar a review. La
    revisión previa queda para author. Fase 1 con edición en vivo de los
    publicados; fase 2 con cambios pendientes y published_version_id.
