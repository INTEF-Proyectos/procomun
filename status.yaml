# STATUS — Tablero de estado global
# Fuente de verdad del proyecto. Ver ADR-0019 para la justificación del formato.
#
# Las tareas usan claves map únicas (T-YYYY-MM-DD-NNN) para evitar
# conflictos de merge cuando varias ramas modifican tareas distintas en paralelo.
# El campo status reemplaza la antigua separación active_tasks/completed_tasks.
#
# Valores de status: Pending | In Progress | Done
# Lee este archivo antes de comenzar cualquier tarea.

