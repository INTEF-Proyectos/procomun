  current_agent: "@.agents/skills/devops-sre + @.agents/skills/qa-validacion"
  instructions: >
    Todos los agentes deben leer este archivo antes de comenzar cualquier tarea para entender
    el contexto global y el progreso del proyecto. Al finalizar una tarea, deben actualizar
    su progreso aquí. Nunca borrar historial antiguo, solo añadir nuevas entradas.

