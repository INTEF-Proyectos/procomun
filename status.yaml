  T-2026-06-22-007:
    date: 2026-06-22
    agent: "backend-api-servicios + seguridad-privacidad-legal + qa-validacion"
    task: "author/editor/curator no podian subir recursos correctamente (#221)"
    status: Done
    related: ["#221"]
    notes: >
      El gate global requireRole("curator") en /api/admin (introducido al corregir DEF-004) bloqueaba a author
      y editor con "Permisos insuficientes" pese a que las rutas de recursos usan baseRole "author". Ademas
      canManageResource solo permitia al curator gestionar recursos en "review", por lo que un curator que creaba
      un recurso (borrador) no podia verlo y la UI mostraba "Recurso no encontrado". Solucion: el gate global de
      /api/admin baja a requireRole("author") (sigue bloqueando reader) y cada seccion que requiere mas privilegio
      (collections, taxonomies, reports, users -> curator; settings, fts, api-tokens -> admin) recibe un gate
      explicito, ademas del control interno de cada sub-router. canManageResource pasa a permitir que el creador
      gestione su propio recurso en cualquier estado, manteniendo la cola de curacion (review) para el curator.
      Sin cambios de frontend (ResourceFormIsland/ResourceEditorIsland ya admitian author+). Tests de matriz de
      permisos añadidos/actualizados.
      Revision de seguridad adversaria posterior: al bajar el piso a author quedaban expuestas dos rutas elpx
      (/upload/:resourceId y /save/:resourceId) que solo comprobaban existencia del recurso (IDOR: cualquier
      author podia sobrescribir el .elpx de un recurso ajeno); se añade el control canManageResource a ambas, a
      la par que /generate. Ademas /api/admin/uploads/config dejaba de requerir curator y filtraba storageDir
      (ruta interna del servidor); se omite storageDir en la respuesta. Tests de IDOR y de la config añadidos.
      Validacion final: bun run test OK (650 pass, 0 fail), coverage 90.38%, lint/format OK.

