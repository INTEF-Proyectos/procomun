    agent: "seguridad-privacidad-legal + frontend-ux-accesibilidad + interoperabilidad-educativa + qa-validacion"
    task: "Reproducción segura de vídeos/PDF embebidos en .elpx con origen opaco (ADR-0027)"
    status: Done
    related: [ADR-0027, T-2026-06-14-001]
    notes: >
      El origen opaco de la Parte 1 (ADR-0026) rompe los embeds anidados (YouTube/Vimeo/PDF) porque el sandbox
