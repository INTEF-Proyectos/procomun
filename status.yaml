    status: Done
    related: ["#542", "#527", "ADR-0007"]
    notes: >
      GET /api/v1/config construia la URL de cierre de sesion como
      {OIDC_ISSUER}/connect/endsession, la ruta de Duende IdentityServer, el
      proveedor de demostracion. Keycloak la publica en
