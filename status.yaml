    task: "La foto de Gravatar se carga en el menú y en el perfil"
    status: Done
    related: ["#514", "#504", "ADR-0037"]
    notes: >
      Nadie veía su foto de Gravatar, ni los usuarios nuevos ni los antiguos.
      gravatarUrl (shared-utils.ts) resumía el correo con un hash propio de 64
      bits (16 caracteres hex), y Gravatar solo reconoce el SHA-256 o el MD5
