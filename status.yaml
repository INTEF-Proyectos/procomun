      responde (incluido el null de uno que no publica el campo) y no se
      guardan los fallos de red ni los 5xx, para que un corte no deje el
      cierre de sesion roto hasta reiniciar. Adenda fechada en ADR-0007 y
      variable documentada en .env.example e instalacion.md. Tests con un
      proveedor de prueba en oidc-discovery.unit.test.ts.
