  T-2026-10-14-10535343:
    date: 2026-10-14
    agent: "seguridad-privacidad-legal + backend-api-servicios + qa-validacion"
    task: "Iframes hijos de un .elpx bloqueados en Chromium: audio (#379), cuadro gris (#381) y diapositivas (#391)"
    status: Done
    related: ["#379", "#381", "#391", "#388", "ADR-0026", "ADR-0027"]
    notes: >
      El HTML del paquete es origen opaco (sandbox sin allow-same-origin) y se
      servía con frame-ancestors 'self'. Chromium y WebKit no casan un ancestro
      opaco con ninguna fuente, tampoco con *, y bloqueaban el iframe hijo del
      propio paquete (reproductor de audio, diapositiva). Se quita
      frame-ancestors de ELPX_HTML_CSP y nginx.conf da a /api/v1/elpx/ su propio
      location sin X-Frame-Options (con ^~, que además evita que la regex de
      estáticos se quede con sus .css y .js). Adenda en ADR-0026. Validación:
      e2e/tests/public/elpx-nested-frame.e2e.ts (paquete sintético anidado en el
      visor de la ficha; rojo con 'self' y con *, verde sin la directiva),
      cabeceras sobre la app completa en public-version-access.unit.test.ts,
      nginx:alpine en Docker (sin X-Frame-Options solo en /api/v1/elpx/) y
      Chrome 155 con los paquetes reales de #379 (audio readyState 4, 7 s) y
      #391 (diapositiva cargada) en la ficha y detrás de nginx.

