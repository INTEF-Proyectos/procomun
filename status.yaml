      map tapan el token (:token) y el id (:previewId), y el hash se conserva.
      Sin cambios de rutas, cabeceras ni caché. Test:
      scripts/nginx-log-redaction.unit.test.ts lee nginx.conf y ejecuta las
      regex de los map contra URL de ejemplo y contra el enlace firmado real
      (rojo → verde). Con nginx:alpine en Docker, nginx -t pasa con el host
      api resoluble y el log de peticiones reales no lleva ningún secreto.
      Queda abierto: el error_log no admite formato y un 502 escribe la
      petición entera; un proxy inverso delante de producción tiene que
      redactar igual (docs/operaciones/operaciones.md); api_access_logs guarda
      la ruta de #466 entera hasta que entre redactAuditPath con #317.
