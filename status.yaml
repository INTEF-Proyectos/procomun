      de la URI ya lo cubria el commit que registra $uri en /api/ (nginx
      resuelve .. y %2e%2e), pero con nginx:alpine real quedaban seis fugas:
      la barra invertida en la URI (nginx no la trata como separador y Bun la
      convierte en /) y el Referer con .., ., // o \. Se falla cerrado: fuera
      de la API una ruta pedida con .., ., //, \, %2e, %2f o %5c se registra
      como /:noncanonical; en la API, $uri con \ tambien; el Referer queda en
      origen + /:noncanonical. Test: scripts/nginx-log-redaction.unit.test.ts,
      el simulador de $uri resuelve ahora los segmentos como nginx; 15 casos
      nuevos fallaban y pasan (98 en verde). Verificado con nginx:alpine y una
      API falsa en Bun: nginx -t pasa y 29 peticiones con --path-as-is dejan 0
      secretos en el log (6 antes del cambio). Documentado en
      docs/operaciones/operaciones.md.
