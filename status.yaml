      bio real vía getUserById). TDD: tests que fallaban primero (bio undefined) y luego en verde en repositorio
      (repository.unit.test.ts), endpoint con autoservicio de curator y vaciado por admin (admin.unit.test.ts) y
      contrato del cliente (http-api-client-users.unit.test.ts). Validación: bun run test:standard OK
