      d=mp, la silueta. El perfil, además, resumía `${id}@procomun.es` en vez
      del correo de la sesión. La CSP no intervenía: las páginas de la
      aplicación no envían CSP, Referrer-Policy ni COEP (nginx.conf solo pone
      X-Frame-Options y nosniff), y Gravatar sirve image/jpeg sin CORP.
      Nuevo lib/gravatar.ts: SHA-256 con crypto.subtle del correo normalizado,
      calculado una vez al cargar la sesión (toNavUser en el menú y
      profileAvatarUrl, s=192, en el perfil, que lo guarda en
      PublicUserProfile.avatarUrl). Solo se resume el correo del propio
      usuario. Sin crypto.subtle (página sin HTTPS) o si la imagen no carga,
      el componente UserAvatar muestra la inicial del nombre. No hay foto de
      perfil propia en main: user.image no se usa para representar al usuario
      (ADR-0037); cuando exista user_profile.image irá en avatarUrl antes que
      Gravatar. Si se mantiene Gravatar lo decide #504. Tests rojo → verde en
