      anunciar guardado correcto. TDD/regresión: apps/api/src/routes/social.unit.test.ts cubre reader
      sin fila previa + persistencia tras recarga; apps/frontend/src/lib/http-api-client-users.unit.test.ts
      cubre el nuevo contrato del cliente; además se ejecutan regresiones en admin.unit.test.ts y
