# STATUS — Tablero de estado global
# Fuente de verdad del proyecto. Ver ADR-0019 para la justificación del formato.
#
# Claves map únicas para evitar conflictos de merge entre ramas en paralelo.
# Formato NUEVO (obligatorio en entradas nuevas): T-YYYY-MM-DD-HHMMSSrr
#   fecha UTC + hora:minuto:segundo UTC + 2 dígitos aleatorios.
#   Generar con: bun run new-status-key
# Formato LEGACY (no reescribir): T-YYYY-MM-DD-NNN
# No reutilices el contador NNN del día: colisiona entre PRs y check-tracking falla.
# El campo status reemplaza la antigua separación active_tasks/completed_tasks.
#
# Valores de status: Pending | In Progress | Done
# Lee este archivo antes de comenzar cualquier tarea.

metadata:
  phase: "Fase 1 — MVP de catálogo"
